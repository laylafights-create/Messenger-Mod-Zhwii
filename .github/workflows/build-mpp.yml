name: Build patches bundle

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-mpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle downloads, so a second run is much faster.
      - uses: gradle/actions/setup-gradle@v4

      # The runner already ships the Android SDK: accept licenses and make sure platform 36 is there.
      - name: Prepare Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -1)
          (yes || true) | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" || true

      - name: Build the .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :patches:buildAndroid --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: patches-bundle
          path: patches/build/libs/*.mpp
          if-no-files-found: error
